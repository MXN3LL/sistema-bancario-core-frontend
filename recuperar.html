<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar acceso - Banco Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="recuperar-page">
<main class="auth-shell">
  <div class="auth-container glass-card">
    <div class="brand-mark"><span class="brand-dot"></span>Banco Core</div>

    <form id="recuperar-form" novalidate>
      <h1>Recuperar acceso</h1>
      <p class="form-subhead">Te enviaremos instrucciones a tu correo</p>
      <div class="heading-rule"></div>

      <p class="auth-error" id="auth-error"></p>
      <p class="success-banner" id="success-banner">Listo. Revisa tu correo para continuar.</p>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>
        <span class="error-message" id="email-error"></span>
      </div>

      <button type="submit" id="recuperar-submit" class="btn btn-primary btn-block">Enviar instrucciones</button>
      <p class="signup-hint"><a href="index.html" class="forgot-link">Volver a iniciar sesión</a></p>
    </form>
  </div>
</main>

<script src="js/animations.js"></script>
<script src="js/recuperar.js"></script>
</body>
</html>
