<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar acceso - Banco Core</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">
    <main class="login-container">
        <div class="brand-mark"><span class="brand-dot"></span>Banco Core</div>

        <form id="recover-form" novalidate>
            <h1>Recuperar acceso</h1>
            <p class="recover-subtitle">Escribe tu correo y te enviaremos instrucciones para recuperar tu usuario o restablecer tu contraseña.</p>

            <div class="form-group">
                <label for="recover-email">Correo electrónico</label>
                <input type="email" id="recover-email" name="recover-email" required>
                <span class="error-message" id="recover-email-error"></span>
            </div>

            <button type="submit">Enviar instrucciones</button>

            <p class="result-message" id="recover-result"></p>

            <a href="index.html" class="back-link">&larr; Volver a iniciar sesión</a>
        </form>
    </main>

    <script src="js/recuperar.js"></script>
</body>
</html>
