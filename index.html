<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Banco Core</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">
    <main class="login-container">
        <div class="brand-mark"><span class="brand-dot"></span>Banco Core</div>

        <form id="login-form" novalidate>
            <h1>Iniciar sesión</h1>
            <p class="form-subhead">Accede a tu cuenta para continuar</p>
            <div class="heading-rule"></div>

            <p class="auth-error" id="auth-error"></p>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" required>
                <span class="error-message" id="email-error"></span>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" required>
                    <button type="button" class="toggle-password" id="toggle-password">Mostrar</button>
                </div>
                
                <span class="error-message" id="password-error"></span>
            </div>

            <div class="form-options">
                <label class="checkbox-label">
                    <input type="checkbox" id="remember-email">
                    Recordar mi correo
                </label>
                <a href="recuperar.html" class="forgot-link">¿Olvidaste tu contraseña o usuario?</a>
            </div>

            <button type="submit" id="login-submit">Entrar</button>
            <p class="signup-hint">¿No tienes cuenta? <a href="registro.html" class="forgot-link">Crea una nueva</a></p>
        </form>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
