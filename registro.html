<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta - Banco Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="registro-page">
<main class="auth-shell">
  <div class="auth-container glass-card">
    <div class="brand-mark"><span class="brand-dot"></span>Banco Core</div>

    <form id="registro-form" novalidate>
      <h1>Crea tu cuenta</h1>
      <p class="form-subhead">Empieza a manejar tu dinero de forma simple</p>
      <div class="heading-rule"></div>

      <p class="auth-error" id="auth-error"></p>

      <div class="form-group">
        <label for="name">Nombre completo</label>
        <input type="text" id="name" name="name" placeholder="Tu nombre" required>
        <span class="error-message" id="name-error"></span>
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>
        <span class="error-message" id="email-error"></span>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required>
          <button type="button" class="toggle-password" id="toggle-password">Mostrar</button>
        </div>
        <span class="error-message" id="password-error"></span>
      </div>

      <button type="submit" id="registro-submit" class="btn btn-primary btn-block">Crear cuenta</button>
      <p class="signup-hint">¿Ya tienes cuenta? <a href="index.html" class="forgot-link">Inicia sesión</a></p>
    </form>
  </div>
</main>

<script src="js/animations.js"></script>
<script src="js/api.js"></script>
<script src="js/registro.js"></script>
</body>
</html>
